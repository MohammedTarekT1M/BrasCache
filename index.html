<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BrasCache</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <header>
    <h1>BrasCache</h1>
    <p>Vind de geocaches in jouw buurt.</p>
  </header>

  <main>
    <section class="card">
  <h2>Jouw locatie</h2>
  <p id="userLocation">Locatie wordt opgehaald...</p>
  <p id="compassHeading">Kompas: nog niet beschikbaar</p>
  <button id="compassButton">Start kompas</button>
</section>

    <section class="card">
      <h2>GeoCaches</h2>
      <ul id="locationsList"></ul>
    </section>

    <section class="card">
  <h2>Foto gevonden cache</h2>
  <p id="photoInfo">Je kunt een foto maken wanneer je binnen 5 meter van een cache bent.</p>

  <input
    type="file"
    id="photoInput"
    accept="image/*"
    capture="environment"
    style="display: none;"
  >

  <button id="photoButton" disabled>Maak foto</button>

  <div id="photoPreview"></div>
</section>

    <section class="card">
      <h2>Radar</h2>
      <canvas id="radarCanvas" width="350" height="350"></canvas>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service Worker geregistreerd"))
        .catch(error => console.error("Service Worker fout:", error));
    }
  </script>
</body>
</html>
